name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456789:TEST_TOKEN_FOR_CI_ONLY"
      BOT_USERNAME: "chikin_test_bot"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
      SECRET_KEY: "ci-only-secret-key-with-more-than-32-characters"
      INVITE_TOKEN_SALT: "ci-only-invite-token-salt-with-more-than-32-characters"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest -q
